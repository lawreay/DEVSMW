name: PHP Lint

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 06:00 Africa/Blantyre (UTC+2)
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0)
          if [ "$count" -eq 0 ]; then
            echo "No PHP files found to lint."
            exit 1
          fi
          echo "Successfully linted $count PHP files."
